name: Update GitHub Solar System
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/generate_solar_system.py'
      - '.github/workflows/update-solar-system.yml'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate SVG
        env:
          GITHUB_USERNAME: ranjeet22
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT_PATH: assets/solar-system.svg
        run: python scripts/generate_solar_system.py
      - name: Commit updated SVG
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/solar-system.svg
          git diff --cached --quiet || git commit -m 'chore: update GitHub solar system'
          git push
